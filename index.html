<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="fejlec">
        <h1>Reszponzív Feladatkezelő</h1>
    </header>
    <div id="menuIconDiv">
        <img src="assets/Képek/more.png" alt="Menü ikon" id="menuIcon">
    </div>
    <nav id="navbar">
        
        <ul>
            <li>Feladatok</li>
            <li>Feladatok törlése</li>
            <li>        
            <p>Témaváltás</p>
            <section class="temaValtas" aria-label="Téma váltó">
                <button class="temaValt" aria-pressed="true" value="vilagos">
                    <img src="assets/Képek/light-bulb (1).png" alt="">
                </button>
                <button class="temaValt" aria-pressed="false" value="sotet">
                    <img src="assets/Képek/house-rules.png" alt="">
                </button>
	        </section>
            </li>
        </ul>
    </nav>
    <main id="tartalom">
        <div class="feladatok">
            <h2>Feladatok</h2>
            <form>
                <input type="text" name="feladat" id="feladat" placeholder="Új feladat">
                <button type="submit" onclick="hozzaAd()" id="hozzaAdGomb">Hozzáadás</button>
                
            </form>
            <form>
                <input type="text" name="kereses" id="kereses" placeholder="Keresés">
                <button type="submit" onclick="keres()" id="keresesGomb">Keresés</button>
            </form>
            <div id="todoContainer"></div>
        </div>
        
    </main>
    <footer>
        <button type="button" id="OsszesTorlese" onclick="osszesTorlese()">Összes törlése</button>
    </footer>
<script src="script.js"></script>
</body>
</html>

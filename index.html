<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Reszponzív Feladatkezelő</h1>
    </header>
    <nav>
        <ul>
            <li>Feladatok</li>
            <li>Feladatok törlése</li>
            <li>        
            <p>Témaváltás</p>
            <section class="temaValtas" aria-label="Téma váltó">
                <button class="temaValt" aria-pressed="true" value="vilagos">
                    Világos
                </button>
                <button class="temaValt" aria-pressed="false" value="sotet">
                    Sötét
                </button>
	        </section>
            </li>
        </ul>
    </nav>
    <main>
        <div class="feladatok">
            <h2>Feladatok</h2>
            <form action="">
                <input type="text" name="feladat" id="feladat" placeholder="Új feladat">
                <button type="submit">Hozzáadás</button>
            </form>

            <card class="feladat">
                <checkbox class="checkbox"></checkbox>
                <p>Első feladat</p>
                <p>userID: 1, id: 1, title: "delectus aut autem", completed: false</p>
                <button class="torles">Törlés</button>
            </card>
        </div>
    </main>
<script src="script.js"></script>
</body>
</html>
